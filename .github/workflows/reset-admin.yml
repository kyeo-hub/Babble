name: Reset Admin Account

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate deploy config (wrangler.deploy.jsonc)
        run: |
          infra_out="$(./scripts/deploy/ensure-infra.sh)"
          eval "$(printf '%s\n' "$infra_out" | sed 's/^/export /')"
          node scripts/deploy/build-config.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Reset users & api_tokens (D1 remote)
        run: |
          ./node_modules/.bin/wrangler d1 execute babble --config wrangler.deploy.jsonc --remote \
            --command "DELETE FROM users; DELETE FROM api_tokens;" -y
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
