name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy (ensure infra / migrations / secrets / deploy)
        run: ./scripts/deploy/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEED_ADMIN_USERNAME: ${{ vars.SEED_ADMIN_USERNAME }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REPORT_REPO: ${{ vars.REPORT_REPO }}
          REPORT_ISSUE_TOKEN: ${{ secrets.REPORT_ISSUE_TOKEN }}
